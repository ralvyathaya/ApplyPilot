# Direct ATS employer registry for ApplyPilot
# Direct company career portals using public JSON APIs (Greenhouse, Lever, Ashby).
# Zero scraping hurdles, zero bot challenges, 100% genuine active listings.
#
# Supported ats types:
#   - greenhouse: https://boards-api.greenhouse.io/v1/boards/{slug}/jobs?content=true
#   - ashby: https://api.ashbyhq.com/posting-api/job-board/{slug}
#   - lever: https://api.lever.co/v0/postings/{slug}?mode=json

